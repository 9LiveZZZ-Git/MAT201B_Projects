# corvid dependency pins — exact versions for reproducible builds.
# Spec §11.1: pin every external dependency by commit/tag.
#
# corvid is allolib + plain-C++ only. The former [llama_cpp] and [torch] pins
# were removed when RavenNet and LLM reflection were rewritten natively:
#   - RavenNet  -> hand-rolled MLP + LoRA + PPO (cognition/RavenBrain.cpp)
#   - reflection-> procedural reflector (cognition/Reflection.cpp) on a thread
# No torch / llama / ggml / Python remain. See docs/REWRITE_PLAN.md.

[allolib]
# Playground submodule; tracked by the parent allolib_playground repo.
commit = "playground-tracked"
note = "allolib + al_ext via git submodule update --init --recursive"
