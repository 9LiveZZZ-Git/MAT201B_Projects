# CI: build the allolib-native corvid math targets.
# These tests need no GPU, display, or external ML runtime — they validate the
# hand-rolled RavenNet (PPO learning + finiteness) and the Kahan-EMA place grid.
name: corvid-ci

on: [push, pull_request]

jobs:
  native-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: RavenNet numeric smoke test
        run: |
          cd corvid
          g++ -std=c++17 -O2 -Wall -Wextra -I. \
            test/test_ravenbrain.cpp cognition/RavenBrain.cpp -o brain_smoke
          ./brain_smoke

      - name: Place-grid Kahan EMA unit test
        run: |
          cd corvid
          g++ -std=c++17 -O2 -Wall -Wextra -I. \
            test/test_place_kahan.cpp -o kahan_test
          ./kahan_test
